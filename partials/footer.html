<footer class="tz-footer">
  <div class="tz-footer-inner">
    <div class="tz-footer-req">
      <div class="tz-footer-org">{{ORG_NAME}}</div>
      <div class="tz-footer-line">ИНН {{INN}} · ОГРНИП {{OGRNIP}}</div>
      <div class="tz-footer-line">{{ADDRESS}}</div>
      <div class="tz-footer-line"><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></div>
    </div>
    <div class="tz-footer-links">
      <a href="/privacy">Политика обработки персональных данных</a>
      <a href="/terms">Условия использования</a>
    </div>
    <div class="tz-footer-copy">© {{YEAR}} ТехЗаказ</div>
  </div>
  <div class="tz-cookie" id="tzCookie" hidden>
    <span>Мы используем cookie, чтобы сайт работал и чтобы понимать, как им пользуются. Подробнее — в <a href="/privacy">политике</a>.</span>
    <button type="button" onclick="tzCookieAccept()">Понятно</button>
  </div>
  <script>
    (function () {
      try {
        if (!localStorage.getItem('tzCookieAck')) document.getElementById('tzCookie').hidden = false;
      } catch (e) { /* приватный режим — плашку не показываем */ }
    })();
    function tzCookieAccept() {
      try { localStorage.setItem('tzCookieAck', '1'); } catch (e) { /* см. выше */ }
      document.getElementById('tzCookie').hidden = true;
    }
  </script>
  <style>
    /* Фолбэки в var() обязательны: tokens.css приходит только через @import в theme-v2.css,
       а его грузят не все страницы с футером (landing, login, zakupki/*). Значения — светлая тема. */
    /* color-scheme + явные цвета — страховка от принудительного тёмного режима
       браузера и тёмных расширений: они перекрашивают текст по своим правилам и
       на белом футере дают белым по белому. Реквизиты и ссылку на политику
       обязаны видеть все, поэтому здесь цвета не зависят от переменных темы. */
    /* position + z-index обязательны: без собственного контекста наложения
       WebKit (Safari на iPhone, Яндекс.Браузер) футер не отрисовывал — блок
       занимал место и ловил клики, поэтому по невидимой ссылке можно было
       уйти в политику, но на экране была пустая полоса. Chromium на десктопе
       рисовал нормально, из-за чего ошибка ловилась только на устройствах. */
    .tz-footer { position: relative; z-index: 1; grid-column: 1 / -1; color-scheme: light; border-top: 1px solid var(--inner-border, #E2E8F0); background: var(--card-bg, #FFFFFF); padding: 28px 32px; margin-top: 48px; }
    :root:not([data-theme="dark"]) .tz-footer { background: #FFFFFF; }
    :root:not([data-theme="dark"]) .tz-footer .tz-footer-inner,
    :root:not([data-theme="dark"]) .tz-footer .tz-footer-line,
    :root:not([data-theme="dark"]) .tz-footer .tz-footer-copy,
    :root:not([data-theme="dark"]) .tz-footer .tz-footer-links a,
    :root:not([data-theme="dark"]) .tz-footer .tz-footer-req a,
    :root:not([data-theme="dark"]) .tz-cookie { color: #64748B; }
    :root:not([data-theme="dark"]) .tz-footer .tz-footer-org { color: #0F172A; }
    .tz-footer-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; font-size: 13px; color: var(--text-secondary, #64748B); }
    .tz-footer-org { font-weight: 700; color: var(--text-primary, #0F172A); margin-bottom: 4px; }
    .tz-footer-line { line-height: 1.7; }
    .tz-footer-links { display: flex; flex-direction: column; gap: 6px; }
    .tz-footer-links a, .tz-footer-req a { color: var(--text-secondary, #64748B); text-decoration: none; border-bottom: 1px solid var(--inner-border, #E2E8F0); }
    .tz-footer-links a:hover, .tz-footer-req a:hover { color: var(--accent-bright, #FF6A00); border-bottom-color: var(--accent-bright, #FF6A00); }
    .tz-footer-copy { align-self: flex-end; }
    /* Плашка в потоке футера, а не fixed поверх страницы: на узких экранах
       фиксированная перекрывала кнопку входа через Яндекс на login и съедала клик. */
    .tz-cookie { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; max-width: 780px; margin: 20px auto 0; padding: 14px 18px; font-size: 13px; background: var(--card-bg, #FFFFFF); color: var(--text-secondary, #64748B); border: 1px solid var(--inner-border, #E2E8F0); border-radius: 3px; box-shadow: 3px 3px 0 var(--inner-border, #E2E8F0); }
    /* Авторский display:flex выше перебивает UA-правило [hidden]{display:none} — без этого плашка неснимаемая. */
    .tz-cookie[hidden] { display: none !important; }
    .tz-cookie a { color: var(--accent-bright, #FF6A00); }
    .tz-cookie button { height: 34px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--accent-bright, #FF6A00); background: var(--accent-bright, #FF6A00); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    .tz-cookie button:active { transform: translate(1px, 1px); }
    @media (max-width: 720px) { .tz-footer { padding: 22px 16px; } }
  </style>
</footer>
